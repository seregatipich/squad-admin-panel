pre-commit:
  parallel: true
  commands:
    branch-guard:
      run: bash scripts/git-guard.sh check-commit
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    go-fmt:
      # `gofmt -l` lists unformatted files but exits 0 either way, so the list
      # itself must fail the hook. The bridge only builds for Linux, so vet
      # targets linux/amd64 like its build script; a plain `go vet` fails on
      # macOS for the Linux-only syscalls.
      glob: "apps/bridge/**/*.go"
      run: |
        if ! command -v go >/dev/null 2>&1; then
          echo "[go-fmt] skipping gofmt and go vet: go is not on PATH (the ci go job still runs them)"
          exit 0
        fi
        cd apps/bridge || exit 1
        unformatted="$(gofmt -l -s .)"
        if [ -n "$unformatted" ]; then
          echo "[go-fmt] not gofmt -s formatted (fix with: gofmt -w -s apps/bridge):"
          echo "$unformatted"
          exit 1
        fi
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go vet ./...
    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "[gitleaks] skipping the staged secret scan: gitleaks is not installed"
          exit 0
        fi
        gitleaks protect --staged --config .gitleaks.toml --no-banner --redact

pre-push:
  parallel: false
  commands:
    branch-guard:
      # Reads the native pre-push refspec lines on stdin. It runs on every
      # push, including the dev→master promotion and file-less branch
      # deletions.
      use_stdin: true
      priority: 1
      run: bash scripts/git-guard.sh check-push origin origin
    checklist:
      # The light local pre-check a dev push gets before it deploys the tk104
      # stand: biome, gitleaks, typecheck and tests of what changed since
      # origin/dev (auto-provisioning a test DB when possible; DB-backed suites
      # are skipped with a warning without one). `ci` on master is the
      # authoritative gate. Runs on every push, the dev→master promotion
      # included. Bypass in an emergency with `git push --no-verify`.
      # Knobs: FULL=1 (the full gate: build, test:cov, mutation tests),
      # SKIP_BUILD=1 (with FULL=1), PREPUSH_TURBO_CONCURRENCY (default 2).
      priority: 2
      run: bash scripts/pre-push-checklist.sh
