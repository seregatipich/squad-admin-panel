pre-commit:
  parallel: true
  commands:
    branch-guard:
      run: bash scripts/git-guard.sh check-commit
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    go-fmt:
      glob: "apps/bridge/**/*.go"
      run: |
        cd apps/bridge && gofmt -l -s . && go vet ./...
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact || true

pre-push:
  parallel: false
  commands:
    branch-guard:
      priority: 1
      use_stdin: true
      run: bash scripts/git-guard.sh check-push origin origin
    typecheck:
      run: pnpm turbo run typecheck
    test:
      run: pnpm turbo run test
