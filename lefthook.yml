pre-commit:
  parallel: true
  commands:
    branch-guard:
      run: bash scripts/git-guard.sh check-commit
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    go-fmt:
      glob: "apps/bridge/**/*.go"
      run: |
        cd apps/bridge && gofmt -l -s . && go vet ./...
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact || true

pre-push:
  parallel: false
  commands:
    branch-guard:
      # Reads the native pre-push refspec lines on stdin. It runs on every
      # push, including the dev→master promotion and file-less branch
      # deletions.
      use_stdin: true
      priority: 1
      run: bash scripts/git-guard.sh check-push origin origin
    checklist:
      # The light local pre-check a dev push gets before it deploys the tk104
      # stand: biome, gitleaks, typecheck and tests of what changed since
      # origin/dev (auto-provisioning a test DB when possible; DB-backed suites
      # are skipped with a warning without one). `ci` on master is the
      # authoritative gate. Runs on every push, the dev→master promotion
      # included. Bypass in an emergency with `git push --no-verify`.
      # Knobs: FULL=1 (the full gate: build, test:cov, mutation tests),
      # SKIP_BUILD=1 (with FULL=1), PREPUSH_TURBO_CONCURRENCY (default 2).
      priority: 2
      run: bash scripts/pre-push-checklist.sh
