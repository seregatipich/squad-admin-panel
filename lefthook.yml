pre-commit:
  parallel: true
  commands:
    branch-guard:
      run: bash scripts/git-guard.sh check-commit
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    go-fmt:
      glob: "apps/bridge/**/*.go"
      run: |
        cd apps/bridge && gofmt -l -s . && go vet ./...
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact || true

pre-push:
  parallel: false
  scripts:
    # Script, not command: commands skip when the current branch has no
    # unpushed diff (e.g. during a dev→master promotion push).
    "branch-guard":
      runner: sh
      use_stdin: true
      priority: 1
  commands:
    checklist:
      # This is a fast local pre-check — the cloud `ci` workflow is the
      # authoritative gate. Runs typecheck, biome, build, secret scan, and
      # the affected test suite (auto-provisioning an isolated DB when
      # possible). Any failure blocks the push. Skipped automatically on
      # no-diff pushes (e.g. dev→master promotion). Bypass in an emergency
      # with `git push --no-verify`.
      # Knobs: FULL=1 (full coverage suite), SKIP_BUILD=1 (skip build step).
      priority: 2
      run: bash scripts/pre-push-checklist.sh
