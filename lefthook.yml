pre-commit:
  parallel: true
  commands:
    branch-guard:
      run: bash scripts/git-guard.sh check-commit
    biome-check:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    go-fmt:
      glob: "apps/bridge/**/*.go"
      run: |
        cd apps/bridge && gofmt -l -s . && go vet ./...
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact || true

pre-push:
  parallel: false
  scripts:
    # Script, not command: commands skip when the current branch has no
    # unpushed diff (e.g. during a dev→master promotion push).
    "branch-guard":
      runner: sh
      use_stdin: true
      priority: 1
  commands:
    typecheck:
      run: pnpm turbo run typecheck
    test:
      # CI is the source of truth for the full suite (issue #202). Locally, only run
      # tests when a database is available, and only for packages affected since
      # origin/dev — so a clean checkout or a docs/scripts-only push is not blocked by
      # DB-gated integration suites. Push with --no-verify to skip this entirely.
      run: |
        if [ -z "${DATABASE_URL:-}" ]; then
          echo "pre-push: DATABASE_URL unset — skipping DB-backed tests (CI is the source of truth)."
          exit 0
        fi
        pnpm turbo run test --filter='...[origin/dev]'
