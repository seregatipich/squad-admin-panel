# Stable runtime directory for panel-host-bridge socket.
# Required so Docker bind-mounts of the directory survive bridge restarts —
# bind-mounting the socket file directly froze consumers on the original
# inode after every systemd-driven restart.
#
# Created by systemd-tmpfiles at boot, before sockets.target binds the
# socket inside it (sockets.target -> sysinit.target -> systemd-tmpfiles-setup).
d /run/panel-host-bridge 0750 root panel -
