name: ci
# Verification runs on ephemeral GitHub-hosted Ubuntu VMs: the repository is
# public, so hosted minutes are free, jobs run in parallel, and no verification
# code ever executes on the production host. Only `deploy-tk104.yml` uses the
# repository's own runner on tk104. The local pre-push checklist remains the
# fast first gate, while this workflow is authoritative (CLAUDE.md → "CI gate").
on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  # branch-guard reads the dev run of a promoted commit.
  actions: read

concurrency:
  # Only the newest SHA of a ref matters; a merge wave should not spend runner
  # time on commits that are already superseded.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces the branch model (see CLAUDE.md). Full CI remains limited to trusted
  # master/dev pushes and explicit dispatches — draft branches use the local
  # pre-push gate. On push events this job gives the dev tip SHA the branch-guard
  # result required by the protect-master ruleset for the fast-forward promotion
  # push.
  branch-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit master ancestry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch --no-tags origin dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "OK: master tip is contained in dev"
          else
            echo "::error::master received commit $GITHUB_SHA that is NOT reachable from dev — the branch model was bypassed (see CLAUDE.md). Reconcile by merging origin/master into dev via a work branch, and investigate how the push happened."
            exit 1
          fi
      # master only ever fast-forwards to a dev commit, so its checks already ran
      # on dev; the other jobs skip on master and this step proves that run
      # passed instead of repeating it.
      - name: Require a green dev CI run for this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=dev&head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [[ "${count}" -lt 1 ]]; then
            echo "::error::master received ${GITHUB_SHA}, which has no successful ci run on dev — promote only a dev commit whose CI is green (CLAUDE.md)."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} passed ci on dev"
      - name: Run git-guard test suite
        run: bash scripts/test-git-guard.sh
      - name: Run verify-done test suite
        run: bash scripts/test-verify-done.sh
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run pre-push-checklist test suite
        run: bash scripts/test-pre-push-checklist.sh
      - name: Run workflow-pin test suite
        run: bash scripts/test-workflow-pins.sh
      - name: Run gitignore-pattern test suite
        run: bash scripts/test-gitignore-patterns.sh
      - name: Run workflow security test suite
        run: bash scripts/test-workflow-security.sh
      - name: Run check-runner-health test suite
        run: bash scripts/test-check-runner-health.sh
      - name: Run codeql-default-setup test suite
        run: bash scripts/test-codeql-default-setup.sh
      - name: Run CI runner-strategy test suite
        run: bash scripts/test-ci-runner-strategy.sh
      - name: Run CI test-slice suite
        run: bash scripts/test-ci-test-shard.sh

  # The JavaScript checks run as parallel jobs; `node` below is the single gate
  # that required status checks and the deploy trigger rely on.
  node-lint:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - name: Check every vitest package is in test:cov
        run: bash scripts/test-cov-complete.sh
      - name: Run solve-issues runner tests
        run: pnpm run solve:issues:test
      - run: pnpm turbo run typecheck --concurrency=4
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1

  node-test:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    # A hosted VM starts without a Turbo cache; the API suite is the longest
    # single run, so its slice carries the margin.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `build` builds only what the slice's tests load: the API suite and
          # the workers' contract tests start built `dist/` entrypoints, while the
          # web suite needs its dependencies but never the Next.js build.
          - shard: api
            build: --filter=@squad/api...
            forks: "4"
            concurrency: "1"
          - shard: web
            build: --filter=@squad/web^...
            forks: "4"
            concurrency: "1"
          - shard: packages
            build: --filter=!@squad/web --filter=!@squad/api
            forks: "2"
            concurrency: "3"
    services:
      # Dynamic host ports (Docker assigns a free one); the resolved ports are
      # read back below via the job.services context. tmpfs keeps an interrupted
      # job from leaving anonymous volumes behind.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --tmpfs /data:rw,size=128m
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: test_password
      VITEST_MAX_FORKS: ${{ matrix.forks }}
      PNPM_WORKSPACE_CONCURRENCY: ${{ matrix.concurrency }}
    steps:
      - name: Resolve service ports
        # Export BOTH pairs: workers + @squad/db migrate read DATABASE_URL/REDIS_URL,
        # while the API integration harness reads TEST_DATABASE_URL/TEST_REDIS_URL
        # (see CLAUDE.md). Without the TEST_* pair the harness falls back to
        # 127.0.0.1:5432/6379 instead of the dynamic-port service containers. The
        # harness isolates on redis db 15.
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build what the slice loads
        run: pnpm turbo run build --concurrency=4 ${{ matrix.build }}
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run tests with coverage
        run: bash scripts/ci-test-shard.sh ${{ matrix.shard }}
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}-${{ matrix.shard }}
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 7

  node-scripts:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    timeout-minutes: 30
    services:
      # Dynamic host ports (Docker assigns a free one); the resolved ports are
      # read back below via the job.services context. tmpfs keeps an interrupted
      # job from leaving anonymous volumes behind.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --tmpfs /data:rw,size=128m
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: test_password
    steps:
      - name: Resolve service ports
        # Export BOTH pairs: workers + @squad/db migrate read DATABASE_URL/REDIS_URL,
        # while the API integration harness reads TEST_DATABASE_URL/TEST_REDIS_URL
        # (see CLAUDE.md). Without the TEST_* pair the harness falls back to
        # 127.0.0.1:5432/6379 instead of the dynamic-port service containers. The
        # harness isolates on redis db 15.
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production artifacts
        run: pnpm turbo run build --concurrency=4
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run operations and verification script tests
        run: pnpm test:scripts
      # Stryker takes minutes and only mutates packages/shared-config, so it runs
      # when that package changed in the pushed range — and always for a manual
      # dispatch, a new branch, or a range the checkout cannot resolve.
      - name: Decide whether shared-config changed
        id: mutation
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != push || -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]] ||
             ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null ||
             ! git diff --quiet "${BEFORE}" "${GITHUB_SHA}" -- packages/shared-config; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run shared-config mutation tests (Stryker)
        if: steps.mutation.outputs.run == 'true'
        run: pnpm turbo run test:mutation --filter=@squad/shared-config

  node:
    runs-on: ubuntu-24.04
    needs: [node-lint, node-test, node-scripts]
    if: always() && github.ref != 'refs/heads/master'
    timeout-minutes: 5
    steps:
      - name: Require every JavaScript check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != success ]]; then
              echo "::error::a JavaScript check finished as ${result}"
              exit 1
            fi
          done

  go:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    timeout-minutes: 15
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache-dependency-path: apps/bridge/go.sum
      - run: go vet ./...
      # The race detector needs cgo; the hosted Ubuntu image ships a C compiler.
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/panel-host-bridge ./cmd/panel-host-bridge
          ls -la bin/
          # `ldd` exits non-zero on a static binary; success means the binary
          # links shared libraries and would not start on a host without them.
          if ldd bin/panel-host-bridge >/dev/null 2>&1; then
            echo "::error::panel-host-bridge is dynamically linked — it will not start on a host without the matching libraries"
            ldd bin/panel-host-bridge
            exit 1
          fi
          echo "panel-host-bridge is static"

  docker:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      # One parallel build of docker-bake.hcl, tagged with the commit SHA so the
      # exported images are exactly what tk104 runs. Layers are cached per
      # target in the GitHub Actions cache.
      - name: build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          TAG: ${{ github.sha }}
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          files: docker-bake.hcl
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
            workers.cache-from=type=gha,scope=workers
            workers.cache-to=type=gha,scope=workers,mode=max
            caddy-tk104.cache-from=type=gha,scope=caddy-tk104
            caddy-tk104.cache-to=type=gha,scope=caddy-tk104,mode=max
            rnsquadjs.cache-from=type=gha,scope=rnsquadjs
            rnsquadjs.cache-to=type=gha,scope=rnsquadjs,mode=max
      - name: verify api runtime database client
        run: docker run --rm --entrypoint node "squad-panel/api:${GITHUB_SHA}" --input-type=module -e "await import('postgres')"
      - name: verify every production worker is in the workers image
        run: |
          workers=$(sed -n 's/^      WORKER: \([a-z0-9-]*\)$/\1/p' compose.tk104.yml)
          [[ -n "${workers}" ]] || { echo "::error::no WORKER entries found in compose.tk104.yml"; exit 1; }
          docker run --rm --entrypoint sh -e WORKERS="${workers}" "squad-panel/workers:${GITHUB_SHA}" -c '
            for worker in $WORKERS; do
              test -f "/app/apps/workers/${worker}/dist/index.js" || { echo "missing worker ${worker}" >&2; exit 1; }
            done'
          status=0
          docker run --rm "squad-panel/workers:${GITHUB_SHA}" >/dev/null 2>&1 || status=$?
          [[ "${status}" -eq 64 ]] || { echo "::error::workers image without WORKER exited ${status}, expected 64"; exit 1; }
      - name: backup/restore round-trip (INFRA-8)
        env:
          CI_BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash scripts/test-backup-restore.sh
      # A dev commit that passes CI is the only thing a release may deploy, so
      # its images travel with the run; the deploy downloads them by run id.
      - name: export release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker save \
            "squad-panel/api:${GITHUB_SHA}" \
            "squad-panel/web:${GITHUB_SHA}" \
            "squad-panel/workers:${GITHUB_SHA}" \
            "squad-panel/caddy-tk104:${GITHUB_SHA}" |
            zstd -T0 -3 -q -o "${RUNNER_TEMP}/release-images.tar.zst"
          ls -lh "${RUNNER_TEMP}/release-images.tar.zst"
      - name: upload release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images-${{ github.sha }}
          path: ${{ runner.temp }}/release-images.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
