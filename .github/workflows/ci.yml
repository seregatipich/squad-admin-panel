name: ci
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  node:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://admin:test_password@localhost:5432/admin
      POSTGRES_PASSWORD: test_password
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run panel-bridge plugin tests
        run: pnpm turbo run test --filter=panel-bridge
      - run: pnpm exec biome check .
      - name: Run tests with coverage
        run: pnpm test:cov
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
      - name: build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/panel-host-bridge ./cmd/panel-host-bridge
          file bin/panel-host-bridge
          ls -la bin/

  docker:
    runs-on: ubuntu-24.04
    needs: [node, go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        run: docker build -f docker/api.Dockerfile -t squad-admin-panel/api:ci .
      - name: build worker-log-ingest image
        run: docker build -f docker/worker.Dockerfile --build-arg WORKER=log-ingest -t squad-admin-panel/worker-log-ingest:ci .
      - name: build worker-rcon image
        run: docker build -f docker/worker.Dockerfile --build-arg WORKER=rcon -t squad-admin-panel/worker-rcon:ci .
      - name: build rnsquadjs sidecar image
        run: docker build -f docker/rnsquadjs.Dockerfile -t squad-panel/rnsquadjs:ci .
