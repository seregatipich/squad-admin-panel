name: ci
# Runs on the organization's own runners, selected by group rather than by label:
# label-based selection is switched off for this project so that GitHub-hosted
# runners can never be picked up by accident. Verification therefore shares the
# machine with `deploy-tk104.yml`; that is acceptable here only because the
# repository is private and the branch model is direct-merge, so no code from an
# outside fork ever reaches this workflow. The local pre-push checklist remains
# the fast first gate, while this workflow is authoritative (AGENTS.md → "CI gate").
on:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  # Only the newest SHA of a ref matters. Cancelling superseded work keeps a merge
  # wave from queueing behind itself on a runner group with one machine in it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces the branch model (see AGENTS.md). Full CI remains limited to trusted
  # master/dev pushes and explicit dispatches — draft branches use the local
  # pre-push gate, preserving the monthly hosted-runner allowance. On push events
  # this job gives the dev tip SHA the branch-guard result required by the
  # protect-master ruleset for the fast-forward promotion push.
  branch-guard:
    runs-on:
      group: selfhost-group-1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit master ancestry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch --no-tags origin dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "OK: master tip is contained in dev"
          else
            echo "::error::master received commit $GITHUB_SHA that is NOT reachable from dev — the branch model was bypassed (see AGENTS.md). Reconcile by merging origin/master into dev via a work branch, and investigate how the push happened."
            exit 1
          fi
      - name: Run git-guard test suite
        run: bash scripts/test-git-guard.sh
      - name: Run verify-done test suite
        run: bash scripts/test-verify-done.sh
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run pre-push-checklist test suite
        run: bash scripts/test-pre-push-checklist.sh
      - name: Run workflow-pin test suite
        run: bash scripts/test-workflow-pins.sh
      - name: Run gitignore-pattern test suite
        run: bash scripts/test-gitignore-patterns.sh
      - name: Run workflow security test suite
        run: bash scripts/test-workflow-security.sh
      - name: Run check-runner-health test suite
        run: bash scripts/test-check-runner-health.sh
      - name: Run codeql-default-setup test suite
        run: bash scripts/test-codeql-default-setup.sh
      - name: Run CI runner-strategy test suite
        run: bash scripts/test-ci-runner-strategy.sh

  node:
    runs-on:
      group: selfhost-group-1
    # The margin stays wide even though the group's runner keeps its Turbo cache
    # between runs: a cache miss after a lockfile change puts the full coverage
    # suite back at roughly 17 minutes, and the whole job once exceeded 30.
    timeout-minutes: 45
    services:
      # Dynamic host ports (Docker assigns a free one) so the job never collides
      # with anything already bound on the runner's host. The resolved ports are
      # read back below via the job.services context.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: test_password
      # Private-repository Ubuntu runners have 2 vCPU; bounded parallelism avoids
      # CPU thrashing and keeps results comparable with the local pre-push gate.
      VITEST_MAX_FORKS: "2"
      PNPM_WORKSPACE_CONCURRENCY: "2"
    steps:
      - name: Resolve service ports
        # Export BOTH pairs: workers + @squad/db migrate read DATABASE_URL/REDIS_URL,
        # while the API integration harness reads TEST_DATABASE_URL/TEST_REDIS_URL
        # (see AGENTS.md). Without the TEST_* pair the harness falls back to
        # 127.0.0.1:5432/6379 instead of the dynamic-port service containers. The
        # harness isolates on redis db 15.
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run solve-issues runner tests
        run: pnpm run solve:issues:test
      - run: pnpm turbo run typecheck --concurrency=2
      - name: Build production artifacts
        run: pnpm turbo run build --concurrency=2
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run operations and verification script tests
        run: pnpm test:scripts
      - name: Run panel-bridge plugin tests
        run: pnpm turbo run test --filter=panel-bridge
      - name: Run shared-config mutation tests (Stryker)
        run: pnpm turbo run test:mutation --filter=@squad/shared-config
      - run: pnpm exec biome check .
      - name: Check every vitest package is in test:cov
        run: bash scripts/test-cov-complete.sh
      - name: Run tests with coverage
        run: pnpm test:cov
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1

  go:
    runs-on:
      group: selfhost-group-1
    timeout-minutes: 15
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache-dependency-path: apps/bridge/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/panel-host-bridge ./cmd/panel-host-bridge
          file bin/panel-host-bridge
          ls -la bin/

  docker:
    runs-on:
      group: selfhost-group-1
    needs: [node, go]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: build api image
        run: docker build -f docker/api.Dockerfile -t squad-admin-panel/api:ci .
      - name: build worker-log-ingest image
        run: docker build -f docker/worker.Dockerfile --build-arg WORKER=log-ingest -t squad-admin-panel/worker-log-ingest:ci .
      - name: build worker-rcon image
        run: docker build -f docker/worker.Dockerfile --build-arg WORKER=rcon -t squad-admin-panel/worker-rcon:ci .
      - name: build rnsquadjs sidecar image
        run: docker build -f docker/rnsquadjs.Dockerfile -t squad-panel/rnsquadjs:ci .
      - name: build web image
        run: docker build -f docker/web.Dockerfile -t squad-admin-panel/web:ci .
      - name: backup/restore round-trip (INFRA-8)
        run: bash scripts/test-backup-restore.sh
