name: ci
# Verification runs on ephemeral GitHub-hosted Ubuntu VMs (the repository is
# public, so hosted minutes are free) and only for what reaches `master` — a
# fast-forward promotion of `dev` — or a manual dispatch. `dev` itself deploys
# straight to the tk104 development stand without tests (deploy-tk104.yml);
# the local pre-push hook is the fast first check and this workflow is the
# authoritative one (CLAUDE.md → "CI gate").
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest SHA of a ref matters; nothing deploys from this workflow,
  # so cancelling a superseded run loses nothing.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces the branch model (see CLAUDE.md) and runs the harness's own
  # contract suites.
  branch-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit master ancestry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch --no-tags origin dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "OK: master tip is contained in dev"
          else
            echo "::error::master received commit $GITHUB_SHA that is NOT reachable from dev — the branch model was bypassed (see CLAUDE.md). Reconcile by merging origin/master into dev via a work branch, and investigate how the push happened."
            exit 1
          fi
      - name: Run git-guard test suite
        run: bash scripts/test-git-guard.sh
      - name: Run verify-done test suite
        run: bash scripts/test-verify-done.sh
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run pre-push-checklist test suite
        run: bash scripts/test-pre-push-checklist.sh
      - name: Run workflow-pin test suite
        run: bash scripts/test-workflow-pins.sh
      - name: Run gitignore-pattern test suite
        run: bash scripts/test-gitignore-patterns.sh
      - name: Run workflow security test suite
        run: bash scripts/test-workflow-security.sh
      - name: Run codeql-default-setup test suite
        run: bash scripts/test-codeql-default-setup.sh
      - name: Run CI runner-strategy test suite
        run: bash scripts/test-ci-runner-strategy.sh
      - name: Run CI test-slice suite
        run: bash scripts/test-ci-test-shard.sh

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck builds every dependency first (`^build`); the previous
      # master run's Turbo cache turns most of that into cache hits.
      - name: Restore the Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm exec biome check .
      - name: Check every vitest package is in test:cov
        run: bash scripts/test-cov-complete.sh
      - name: Run solve-issues runner tests
        run: pnpm run solve:issues:test
      - run: pnpm turbo run typecheck --concurrency=4
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1

  # The API suite is split by test file over four VMs. It needs no build and no
  # migration step: the harness builds its template database from the SQL
  # migrations itself, and vitest resolves every @squad/* import to its source
  # through the packages' `development` export condition.
  test-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # Dynamic host ports (Docker assigns a free one); the resolved ports are
      # read back below via the job.services context. tmpfs keeps an interrupted
      # job from leaving anonymous volumes behind.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --tmpfs /data:rw,size=128m
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_PASSWORD: test_password
      VITEST_MAX_FORKS: "4"
    steps:
      - name: Resolve service ports
        # Export BOTH pairs: workers + @squad/db migrate read DATABASE_URL/REDIS_URL,
        # while the API integration harness reads TEST_DATABASE_URL/TEST_REDIS_URL
        # (see CLAUDE.md). Without the TEST_* pair the harness falls back to
        # 127.0.0.1:5432/6379 instead of the dynamic-port service containers. The
        # harness isolates on redis db 15.
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      # The data directory is a tmpfs thrown away with the job, so durability
      # buys nothing. Service containers take no server arguments, hence
      # ALTER SYSTEM + reload; each statement is its own -c because ALTER
      # SYSTEM refuses to run inside the implicit transaction of a
      # multi-statement string.
      - name: Tune Postgres for throwaway test data
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "${PG_CONTAINER}" psql -U admin -d admin -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the API test shard with coverage
        run: bash scripts/ci-test-shard.sh api ${{ matrix.shard }} 4
      # The gate job merges all four blobs and enforces the coverage thresholds.
      - name: Upload the shard's blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-api-${{ matrix.shard }}
          path: apps/api/.vitest-reports/blob-${{ matrix.shard }}-4.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The web suite runs in jsdom and touches neither Postgres nor Redis, and
  # resolves @squad/* to source like the API suite: no services, no build.
  test-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the web test shard with coverage
        run: bash scripts/ci-test-shard.sh web ${{ matrix.shard }} 2
      # The gate job merges both blobs and enforces the coverage thresholds.
      - name: Upload the shard's blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-web-${{ matrix.shard }}
          path: apps/web/.vitest-reports/blob-${{ matrix.shard }}-2.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Every other test:cov package, each whole under its own coverage thresholds.
  test-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Dynamic host ports (Docker assigns a free one); the resolved ports are
      # read back below via the job.services context. tmpfs keeps an interrupted
      # job from leaving anonymous volumes behind.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --tmpfs /data:rw,size=128m
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_PASSWORD: test_password
      VITEST_MAX_FORKS: "2"
      PNPM_WORKSPACE_CONCURRENCY: "4"
    steps:
      - name: Resolve service ports
        # Export BOTH pairs: workers + @squad/db migrate read DATABASE_URL/REDIS_URL,
        # while the API integration harness reads TEST_DATABASE_URL/TEST_REDIS_URL
        # (see CLAUDE.md). Without the TEST_* pair the harness falls back to
        # 127.0.0.1:5432/6379 instead of the dynamic-port service containers. The
        # harness isolates on redis db 15.
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      # Same reasoning as in test-api: the data directory is a throwaway tmpfs.
      - name: Tune Postgres for throwaway test data
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "${PG_CONTAINER}" psql -U admin -d admin -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-test-packages-${{ github.sha }}
          restore-keys: turbo-test-packages-
      # The worker contract tests start each worker's built dist/index.js under
      # plain Node, which resolves @squad/* to their built output; every other
      # suite here resolves to source through vitest.
      - name: Build the workers the contract tests start
        run: pnpm turbo run build --concurrency=4 --filter='./apps/workers/*'
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run the package tests with coverage
        run: bash scripts/ci-test-shard.sh packages

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Dynamic host ports (Docker assigns a free one); the resolved ports are
      # read back below via the job.services context. tmpfs keeps an interrupted
      # job from leaving anonymous volumes behind.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --tmpfs /data:rw,size=128m
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_PASSWORD: test_password
    steps:
      - name: Resolve service ports
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test:scripts` builds the one package its contracts load
      # (panel-bridge); nothing else needs a build here.
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run operations and verification script tests
        run: pnpm test:scripts

  # Stryker takes minutes and only mutates packages/shared-config, so it runs
  # when that package changed in the pushed range — and always for a manual
  # dispatch, a new branch, or a range the checkout cannot resolve.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mutation: ${{ steps.shared-config.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether shared-config changed
        id: shared-config
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != push || -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]] ||
             ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null ||
             ! git diff --quiet "${BEFORE}" "${GITHUB_SHA}" -- packages/shared-config; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

  mutation:
    needs: changes
    if: needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run shared-config mutation tests (Stryker)
        run: pnpm turbo run test:mutation --filter=@squad/shared-config

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache-dependency-path: apps/bridge/go.sum
      - run: go vet ./...
      # The race detector needs cgo; the hosted Ubuntu image ships a C compiler.
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/panel-host-bridge ./cmd/panel-host-bridge
          ls -la bin/
          # `ldd` exits non-zero on a static binary; success means the binary
          # links shared libraries and would not start on a host without them.
          if ldd bin/panel-host-bridge >/dev/null 2>&1; then
            echo "::error::panel-host-bridge is dynamically linked — it will not start on a host without the matching libraries"
            ldd bin/panel-host-bridge
            exit 1
          fi
          echo "panel-host-bridge is static"

  # Builds docker-bake.hcl and smoke-tests the images. The release images
  # themselves are built and pushed by deploy-tk104.yml when the commit lands
  # on dev; this job reads their GHCR layer cache (never writes it), so a
  # promoted commit rebuilds from cache instead of from scratch.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      # rnsquadjs is not part of a release, so no deploy pushes a registry
      # cache for it; it keeps its GitHub Actions layer cache instead.
      - name: build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          TAG: ${{ github.sha }}
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          files: docker-bake.hcl
          targets: release,rnsquadjs
          load: true
          set: |
            api.cache-from=type=registry,ref=ghcr.io/seregatipich/squad-panel-api:buildcache
            web.cache-from=type=registry,ref=ghcr.io/seregatipich/squad-panel-web:buildcache
            workers.cache-from=type=registry,ref=ghcr.io/seregatipich/squad-panel-workers:buildcache
            caddy-tk104.cache-from=type=registry,ref=ghcr.io/seregatipich/squad-panel-caddy-tk104:buildcache
            rnsquadjs.cache-from=type=gha,scope=rnsquadjs
            rnsquadjs.cache-to=type=gha,scope=rnsquadjs,mode=max
      - name: verify api runtime database client
        run: docker run --rm --entrypoint node "squad-panel/api:${GITHUB_SHA}" --input-type=module -e "await import('postgres')"
      - name: verify every production worker is in the workers image
        run: |
          workers=$(sed -n 's/^      WORKER: \([a-z0-9-]*\)$/\1/p' compose.tk104.yml)
          [[ -n "${workers}" ]] || { echo "::error::no WORKER entries found in compose.tk104.yml"; exit 1; }
          docker run --rm --entrypoint sh -e WORKERS="${workers}" "squad-panel/workers:${GITHUB_SHA}" -c '
            for worker in $WORKERS; do
              test -f "/app/apps/workers/${worker}/dist/index.js" || { echo "missing worker ${worker}" >&2; exit 1; }
            done'
          status=0
          docker run --rm "squad-panel/workers:${GITHUB_SHA}" >/dev/null 2>&1 || status=$?
          [[ "${status}" -eq 64 ]] || { echo "::error::workers image without WORKER exited ${status}, expected 64"; exit 1; }

  # The backup/restore round trip builds only its own toolbox image, so it runs
  # beside the image build instead of after it.
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - name: backup/restore round-trip (INFRA-8)
        env:
          CI_BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash scripts/test-backup-restore.sh

  # The single required status check. It fails unless every job succeeded —
  # including when one was cancelled or skipped; only the mutation job may skip,
  # when shared-config did not change. It then merges the API and web shards'
  # blob reports so their coverage thresholds apply to the whole suite, which
  # no single shard can meet on its own.
  gate:
    runs-on: ubuntu-24.04
    needs: [branch-guard, lint, test-api, test-web, test-packages, scripts, changes, mutation, go, images, backup]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Require every check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[]
            | select(.value.result != "success" and (.key != "mutation" or .value.result != "skipped"))
            | "\(.key)=\(.value.result)"' <<<"${NEEDS}")
          if [[ -n "${failed}" ]]; then
            echo "::error::not every check passed: $(tr '\n' ' ' <<<"${failed}")"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Put the requested Node version on PATH before pnpm/action-setup so pnpm
      # bootstraps through Node rather than a platform-specific standalone exe.
      # The second setup-node call stays because `cache: pnpm` needs pnpm already
      # available to resolve its cache key (#269).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the API blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-api-*
          merge-multiple: true
          path: apps/api/.vitest-reports
      - name: Download the web blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-web-*
          merge-multiple: true
          path: apps/web/.vitest-reports
      - name: Enforce API coverage on the merged shards
        working-directory: apps/api
        run: pnpm exec vitest run --merge-reports --coverage
      - name: Enforce web coverage on the merged shards
        working-directory: apps/web
        run: pnpm exec vitest run --merge-reports --coverage
