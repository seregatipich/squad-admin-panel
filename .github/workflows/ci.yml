name: ci
# Runs on the org self-hosted runner (a Multipass VM: 2 vCPU / 4 GB / 20 GB disk).
# The VM has no auto-refresh yet, so jobs clean up after themselves (see the
# docker job's "Reclaim disk" step) and concurrency is bounded throughout to fit
# the box. The local pre-push checklist (scripts/pre-push-checklist.sh) remains
# the fast first gate; this workflow is the authoritative one (see AGENTS.md →
# "CI gate").
on:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  # One CI run per ref on the small shared runner: supersede stale work-branch
  # runs, but never cancel an in-flight dev or master run.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

jobs:
  # Enforces the branch model (see AGENTS.md). Runs only on trusted push
  # (master/dev) and workflow_dispatch events — never pull_request or
  # pull_request_target — so no untrusted or merely review-stage PR head
  # ever executes on this shared self-hosted runner (#217). On push events
  # the job always succeeds so the dev tip SHA carries a passing
  # branch-guard check — required by the protect-master ruleset for the
  # fast-forward promotion push (.github/rulesets/).
  branch-guard:
    runs-on: self-hosted
    # Single shared self-hosted runner: a wedged job with no timeout could block every subsequent CI run indefinitely, so every job below gets a timeout-minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Audit master ancestry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch --no-tags origin dev
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "OK: master tip is contained in dev"
          else
            echo "::error::master received commit $GITHUB_SHA that is NOT reachable from dev — the branch model was bypassed (see AGENTS.md). Reconcile by merging origin/master into dev via a work branch, and investigate how the push happened."
            exit 1
          fi
      - name: Run git-guard test suite
        run: bash scripts/test-git-guard.sh
      - name: Run verify-done test suite
        run: bash scripts/test-verify-done.sh
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run pre-push-checklist test suite
        run: bash scripts/test-pre-push-checklist.sh
      - name: Run workflow-pin test suite
        run: bash scripts/test-workflow-pins.sh
      - name: Run workflow security test suite
        run: bash scripts/test-workflow-security.sh
      - name: Run check-runner-health test suite
        run: bash scripts/test-check-runner-health.sh
      - name: Run codeql-default-setup test suite
        run: bash scripts/test-codeql-default-setup.sh
      - name: Run runner disk-cleanup test suite
        run: bash scripts/test-runner-disk-cleanup.sh

  prepare-runner:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Reclaim disk before expensive jobs
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=72h"
          docker container prune -f
          docker volume prune -f
          df -h /

  node:
    runs-on: self-hosted
    needs: prepare-runner
    timeout-minutes: 30
    services:
      # Dynamic host ports (Docker assigns a free one) so the job never collides
      # with anything already bound on the runner's host. The resolved ports are
      # read back below via the job.services context.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: admin
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U admin -d admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: test_password
      # Bound Vitest's fork pool and pnpm's workspace concurrency to fit the runner's 2 vCPU / 4 GB.
      VITEST_MAX_FORKS: "2"
      PNPM_WORKSPACE_CONCURRENCY: "2"
    steps:
      - name: Resolve service ports
        # Export BOTH pairs: workers + @squad/db migrate read DATABASE_URL/REDIS_URL,
        # while the API integration harness reads TEST_DATABASE_URL/TEST_REDIS_URL
        # (see AGENTS.md). Without the TEST_* pair the harness falls back to
        # 127.0.0.1:5432/6379 instead of the dynamic-port service containers. The
        # harness isolates on redis db 15.
        run: |
          PG="postgres://admin:test_password@localhost:${{ job.services.postgres.ports['5432'] }}/admin"
          RD="redis://localhost:${{ job.services.redis.ports['6379'] }}"
          {
            echo "DATABASE_URL=$PG"
            echo "TEST_DATABASE_URL=$PG"
            echo "REDIS_URL=$RD"
            echo "TEST_REDIS_URL=$RD/15"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # pnpm/action-setup@v5+ probes `node --version` on PATH and silently falls
      # back to the standalone @pnpm/exe bootstrap (which needs libatomic.so.1,
      # not installed on this runner — see #269) whenever it can't find Node
      # >= 22.13. This runner has no system Node until actions/setup-node runs,
      # so a Node-less pnpm/action-setup step always hit that fallback. Setting
      # up Node here first — before pnpm/action-setup — keeps a real Node on
      # PATH so it bootstraps via plain npm instead. The second setup-node step
      # below stays: actions/setup-node's `cache: pnpm` needs pnpm already on
      # PATH to resolve the cache key, so it must run after pnpm/action-setup.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run solve-issues runner tests
        run: pnpm run solve:issues:test
      - run: pnpm turbo run typecheck --concurrency=2
      - name: Build production artifacts
        run: pnpm turbo run build --concurrency=2
      - name: Apply database migrations
        run: pnpm --filter @squad/db migrate
      - name: Run operations script tests
        run: pnpm test:scripts
      - name: Run panel-bridge plugin tests
        run: pnpm turbo run test --filter=panel-bridge
      - name: Run shared-config mutation tests (Stryker)
        run: pnpm turbo run test:mutation --filter=@squad/shared-config
      - run: pnpm exec biome check .
      - name: Check every vitest package is in test:cov
        run: bash scripts/test-cov-complete.sh
      - name: Run tests with coverage
        run: pnpm test:cov
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --config .gitleaks.toml --no-banner --redact --exit-code 1

  go:
    runs-on: self-hosted
    needs: prepare-runner
    timeout-minutes: 15
    # Run inside a Go container, not directly on the runner host: the bridge tests
    # exercise real absolute paths under /var/lib/squad-panel (e.g. directory_delete)
    # and assume those paths do NOT exist — running os.RemoveAll against a host that
    # happened to have them would be unsafe. The container gives a clean filesystem
    # (the same guarantee a GitHub-hosted VM provided).
    # --user 1000:1000 matches the runner user so no root-owned files are left in
    # the shared _work dir (which would break later non-container jobs).
    container:
      image: golang:1.25.11-bookworm
      options: --user 1000:1000
    env:
      HOME: /tmp/gohome
      GOPATH: /tmp/gohome/go
      GOCACHE: /tmp/gohome/.cache/go-build
      GOFLAGS: -buildvcs=false
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - name: Prepare writable Go dirs
        run: mkdir -p "$GOPATH/bin" "$GOCACHE"
        working-directory: /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$GOPATH/bin/govulncheck" ./...
      - name: build static binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/panel-host-bridge ./cmd/panel-host-bridge
          # `file` is not shipped in the golang image; keep the check best-effort.
          command -v file >/dev/null && file bin/panel-host-bridge || true
          ls -la bin/

  docker:
    runs-on: self-hosted
    needs: [node, go]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: build api image
        run: docker build -f docker/api.Dockerfile -t squad-admin-panel/api:ci .
      - name: build worker-log-ingest image
        run: docker build -f docker/worker.Dockerfile --build-arg WORKER=log-ingest -t squad-admin-panel/worker-log-ingest:ci .
      - name: build worker-rcon image
        run: docker build -f docker/worker.Dockerfile --build-arg WORKER=rcon -t squad-admin-panel/worker-rcon:ci .
      - name: build rnsquadjs sidecar image
        run: docker build -f docker/rnsquadjs.Dockerfile -t squad-panel/rnsquadjs:ci .
      - name: build web image
        run: docker build -f docker/web.Dockerfile -t squad-admin-panel/web:ci .
      - name: backup/restore round-trip (INFRA-8)
        run: bash scripts/test-backup-restore.sh
  cleanup-runner:
    runs-on: self-hosted
    needs: [node, go, docker]
    if: ${{ always() }}
    timeout-minutes: 10
    steps:
      # This job is deliberately separate from `docker`: a failed node/go job
      # skips the gated image build, but must never skip runner cleanup (#281).
      # `image prune` omits `-a`, preserving named production/base images.
      - name: Reclaim disk after every outcome
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=72h"
          docker container prune -f
          docker volume prune -f
          df -h /
