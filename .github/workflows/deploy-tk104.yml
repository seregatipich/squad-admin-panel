name: deploy-tk104

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'ai_docs/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-tk104
  cancel-in-progress: false

jobs:
  # Runs on the self-hosted tk104 runner — the deploy target IS the runner host,
  # so the stack is synced and rebuilt locally instead of over SSH.
  deploy:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve app directory
        # Do NOT trust $HOME — GitHub Actions can inject HOME=/home/runner into the
        # job env even on a self-hosted runner. Resolve the runner user's real home
        # from passwd so the deploy target is always ~seregatipich/apps/....
        run: |
          HOME_DIR="$(getent passwd "$(id -un)" | cut -d: -f6)"
          echo "APP_DIR=${HOME_DIR}/apps/squad-admin-panel" >> "$GITHUB_ENV"

      - name: Sync repository into the app directory
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'data' --exclude 'dist' --exclude '.env' --exclude '.env.*' \
            ./ "$APP_DIR/"

      - name: Build and restart the stack
        # APP_DIR overrides the same-named default in scripts/deploy-tk104.sh, which
        # otherwise falls back to $HOME and would hit the wrong path too.
        run: cd "$APP_DIR" && APP_DIR="$APP_DIR" bash scripts/deploy-tk104.sh

      - name: Local health check (through Caddy on 443)
        # Hit the local Caddy on 127.0.0.1 but with the real SNI/Host — this Caddy
        # serves TLS only for tk104.duckdns.org (DNS-01 cert), so a bare
        # https://localhost request fails the handshake (curl exit 35). --resolve
        # keeps the request local (no hairpin NAT) while presenting the right name.
        run: |
          for _ in $(seq 1 15); do
            code=$(curl -sk --resolve tk104.duckdns.org:443:127.0.0.1 \
              -o /dev/null -w '%{http_code}' https://tk104.duckdns.org/health --max-time 10 || echo 000)
            echo "local https://tk104.duckdns.org/health (127.0.0.1) -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "local health check did not reach 200" >&2
          exit 1

      - name: External health check (non-fatal — hairpin NAT not guaranteed)
        run: |
          for _ in $(seq 1 5); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tk104.duckdns.org/health --max-time 10 || echo 000)
            echo "https://tk104.duckdns.org/health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::warning::external health probe did not reach 200 from inside the LAN (hairpin NAT); local probe is authoritative"
