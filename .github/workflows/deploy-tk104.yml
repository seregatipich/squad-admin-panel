name: deploy-tk104

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'ai_docs/**'
      - 'docs/**'
  # Fires once `ci` finishes on `dev` — used to redeploy only the web
  # container as a preview (see the `deploy-web-preview` job below). Per
  # GitHub's workflow_run semantics, this trigger (and workflow_dispatch's
  # `target: web` path) only activates once this file is present on the
  # default branch (master) — merging it into dev alone is not enough.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: 'deployment or one-time SSO operation'
        type: choice
        default: full
        options: [full, web, site-read-token, sso-cutover]
      expected_sha:
        description: 'exact ref SHA required for one-time SSO operations'
        type: string
        required: false

concurrency:
  # Shared by both jobs below so a full master deploy and a web-only dev
  # preview never touch the tk104 compose project at the same time. Never
  # cancel a deploy mid-flight (a busy dev branch just queues behind it).
  group: deploy-tk104
  cancel-in-progress: false

jobs:
  # Deploys OVER SSH from the org self-hosted runner into the production host
  # (tk104.duckdns.org). The runner is a separate machine, so we rsync the
  # checkout to the host and run scripts/deploy-tk104.sh there via SSH.
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'full')
    runs-on:
      group: selfhost-group-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TK104_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H tk104.duckdns.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repository to tk104
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'data' --exclude 'dist' --exclude '.env' --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" \
            ./ seregatipich@tk104.duckdns.org:~/apps/squad-admin-panel/

      - name: Configure BSS SSO settings
        env:
          BSS_SSO_SHARED_SECRET: ${{ secrets.BSS_SSO_SHARED_SECRET }}
        run: |
          if [[ -z "${BSS_SSO_SHARED_SECRET}" ]]; then
            echo "Required BSS SSO secret is missing." >&2
            exit 1
          fi
          printf '%s' "${BSS_SSO_SHARED_SECRET}" | \
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              seregatipich@tk104.duckdns.org \
              'cd ~/apps/squad-admin-panel && bash scripts/configure-bss-sso-env.sh'

      - name: Build and restart the stack on tk104
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            seregatipich@tk104.duckdns.org \
            'cd ~/apps/squad-admin-panel && bash scripts/deploy-tk104.sh'

      - name: External health check
        run: |
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tk104.duckdns.org/health --max-time 10 || echo 000)
            echo "https://tk104.duckdns.org/health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "external health check did not reach 200" >&2
          exit 1

      - name: Remove SSH deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  # Preview deploy: rebuilds and restarts ONLY the web (frontend) container
  # on the SAME tk104 host/compose project as the job above, once `ci` goes
  # green on `dev` — so a dev push's frontend is visible on tk104 without
  # waiting for a dev -> master promotion. api/workers/postgres/redis are
  # left running whatever the `deploy` job above last deployed from master;
  # only `web` picks up dev's code. This intentionally serves untested dev
  # code on the production host between pushes — accepted tradeoff for a
  # fast frontend preview loop; promote dev -> master as usual once ready.
  deploy-web-preview:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'web')
    runs-on:
      group: selfhost-group-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TK104_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H tk104.duckdns.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repository to tk104
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'data' --exclude 'dist' --exclude '.env' --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" \
            ./ seregatipich@tk104.duckdns.org:~/apps/squad-admin-panel/

      - name: Rebuild and restart only web on tk104
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            seregatipich@tk104.duckdns.org \
            'cd ~/apps/squad-admin-panel && bash scripts/deploy-tk104-web.sh'

      - name: External health check
        run: |
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tk104.duckdns.org/health --max-time 10 || echo 000)
            echo "https://tk104.duckdns.org/health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "external health check did not reach 200" >&2
          exit 1

      - name: Remove SSH deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  provision-site-read-token:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'site-read-token'
    runs-on:
      group: selfhost-group-1
    steps:
      - name: Verify exact dev revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/dev" || "${EXPECTED_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "site-read-token requires the exact requested dev SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TK104_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H tk104.duckdns.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Provision limited site read token
        env:
          PANEL_READ_API_TOKEN: ${{ secrets.PANEL_READ_API_TOKEN }}
        run: |
          if [[ -z "${PANEL_READ_API_TOKEN}" ]]; then
            echo "Required panel read token is missing." >&2
            exit 1
          fi
          encoded_token="$(printf '%s' "${PANEL_READ_API_TOKEN}" | base64 -w 0)"
          {
            printf '%s\n' "${encoded_token}"
            sed -n '1,$p' scripts/provision-site-read-token.mjs
          } | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            seregatipich@tk104.duckdns.org \
            'set -euo pipefail; IFS= read -r SITE_PANEL_READ_TOKEN_B64; export SITE_PANEL_READ_TOKEN_B64 BSS_PROVISION_SITE_READ_TOKEN_RUN=1; cd "$HOME/apps/squad-admin-panel"; docker compose --env-file .env.tk104 -f compose.tk104.yml exec -T -e SITE_PANEL_READ_TOKEN_B64 -e BSS_PROVISION_SITE_READ_TOKEN_RUN api node --input-type=module'
          unset encoded_token

      - name: Remove SSH deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  revoke-sessions-for-sso-cutover:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'sso-cutover' &&
      github.ref == 'refs/heads/master' &&
      github.event.inputs.expected_sha == github.sha
    runs-on:
      group: selfhost-group-1
    steps:
      - name: Configure SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TK104_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H tk104.duckdns.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Revoke old panel sessions with API stopped
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            seregatipich@tk104.duckdns.org 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/apps/squad-admin-panel"
          compose=(docker compose --env-file .env.tk104 -f compose.tk104.yml)
          restart_api() {
            "${compose[@]}" up -d api >/dev/null
          }
          trap restart_api EXIT
          "${compose[@]}" stop api
          "${compose[@]}" run --rm --no-deps api \
            node --enable-source-maps dist/tools/revoke-sessions-for-sso-cutover.js \
              --confirm-all-sessions
          restart_api
          trap - EXIT
          REMOTE

      - name: External health check
        if: always()
        run: |
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tk104.duckdns.org/health --max-time 10 || echo 000)
            echo "https://tk104.duckdns.org/health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "external health check did not recover after SSO cutover" >&2
          exit 1

      - name: Remove SSH deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy
