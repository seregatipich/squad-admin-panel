name: deploy-tk104

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'ai_docs/**'
      - 'docs/**'
  # Fires once `ci` finishes on `dev` — used to redeploy only the web
  # container as a preview (see the `deploy-web-preview` job below). Per
  # GitHub's workflow_run semantics, this trigger (and workflow_dispatch's
  # `target: web` path) only activates once this file is present on the
  # default branch (master) — merging it into dev alone is not enough.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: 'full production deploy or web-only preview'
        type: choice
        default: full
        options: [full, web]
      expected_sha:
        description: 'exact master SHA required for a manual full deploy'
        type: string
        required: false

concurrency:
  # Shared by both jobs below so a full master deploy and a web-only dev
  # preview never touch the tk104 compose project at the same time. Never
  # cancel a deploy mid-flight (a busy dev branch just queues behind it).
  group: deploy-tk104
  cancel-in-progress: false

jobs:
  # Deploys OVER SSH from the repository's own runner (label `tk104-deploy`) into
  # the production host (tk104.duckdns.org). The runner lives on tk104 under an
  # unprivileged account without Docker access, so it rsyncs the checkout to the
  # deploy account and runs scripts/deploy-tk104.sh there via SSH. Every job
  # binds the `production` environment, whose secrets only `master` may read.
  deploy:
    if: github.repository == 'seregatipich/squad-admin-panel' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'full'))
    runs-on: [self-hosted, tk104-deploy]
    environment: production
    steps:
      - name: Verify exact master revision
        env:
          PANEL_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Full production deploy requires master." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" &&
                "${PANEL_EXPECTED_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Manual full deploy requires the exact requested master SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure pinned SSH trust and deploy key
        env:
          TK104_DEPLOY_KEY: ${{ secrets.TK104_SSH_KEY }}
          TK104_SSH_KNOWN_HOSTS: ${{ secrets.TK104_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "${TK104_SSH_KNOWN_HOSTS}" ]]; then
            echo "Pinned tk104 SSH host key is missing." >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "${TK104_SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/tk104_known_hosts"
          chmod 600 "${RUNNER_TEMP}/tk104_known_hosts"
          if ! ssh-keygen -l -f "${RUNNER_TEMP}/tk104_known_hosts" >/dev/null 2>&1 ||
             ! ssh-keygen -F tk104.duckdns.org -f "${RUNNER_TEMP}/tk104_known_hosts" \
               >/dev/null 2>&1; then
            rm -f "${RUNNER_TEMP}/tk104_known_hosts"
            echo "Pinned tk104 SSH host key is invalid." >&2
            exit 1
          fi
          if [[ -z "${TK104_DEPLOY_KEY}" ]]; then
            echo "tk104 SSH deploy key is missing." >&2
            exit 1
          fi
          printf '%s\n' "${TK104_DEPLOY_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Sync repository to tk104
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'data' --exclude 'dist' --exclude '.env' --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=${RUNNER_TEMP}/tk104_known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            ./ seregatipich@tk104.duckdns.org:~/apps/squad-admin-panel/

      - name: Build and restart the stack on tk104
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o UserKnownHostsFile="${RUNNER_TEMP}/tk104_known_hosts" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            seregatipich@tk104.duckdns.org \
            "set -euo pipefail; cd ~/apps/squad-admin-panel; export APP_VERSION='${GITHUB_SHA}'; bash scripts/deploy-tk104.sh"

      - name: External health check
        run: |
          for _ in $(seq 1 10); do
            health="$(curl --fail --silent --show-error \
              https://tk104.duckdns.org/health --max-time 10 || true)"
            if jq -e --arg revision "${GITHUB_SHA}" \
              '.status == "ok" and .version == $revision' <<<"${health}" >/dev/null 2>&1; then
              echo "https://tk104.duckdns.org/health -> exact release"
              exit 0
            fi
            sleep 6
          done
          echo "external health check did not reach the exact release" >&2
          exit 1

      - name: Remove SSH deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy "${RUNNER_TEMP}/tk104_known_hosts"

  # Preview deploy: rebuilds and restarts ONLY the web (frontend) container
  # on the SAME tk104 host/compose project as the job above, once `ci` goes
  # green on `dev` — so a dev push's frontend is visible on tk104 without
  # waiting for a dev -> master promotion. api/workers/postgres/redis are
  # left running whatever the `deploy` job above last deployed from master;
  # only `web` picks up dev's code. This intentionally serves untested dev
  # code on the production host between pushes — accepted tradeoff for a
  # fast frontend preview loop; promote dev -> master as usual once ready.
  deploy-web-preview:
    if: github.repository == 'seregatipich/squad-admin-panel' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'web'))
    runs-on: [self-hosted, tk104-deploy]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure pinned SSH trust and deploy key
        env:
          TK104_DEPLOY_KEY: ${{ secrets.TK104_SSH_KEY }}
          TK104_SSH_KNOWN_HOSTS: ${{ secrets.TK104_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "${TK104_SSH_KNOWN_HOSTS}" ]]; then
            echo "Pinned tk104 SSH host key is missing." >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "${TK104_SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/tk104_known_hosts"
          chmod 600 "${RUNNER_TEMP}/tk104_known_hosts"
          if ! ssh-keygen -l -f "${RUNNER_TEMP}/tk104_known_hosts" >/dev/null 2>&1 ||
             ! ssh-keygen -F tk104.duckdns.org -f "${RUNNER_TEMP}/tk104_known_hosts" \
               >/dev/null 2>&1; then
            rm -f "${RUNNER_TEMP}/tk104_known_hosts"
            echo "Pinned tk104 SSH host key is invalid." >&2
            exit 1
          fi
          if [[ -z "${TK104_DEPLOY_KEY}" ]]; then
            echo "tk104 SSH deploy key is missing." >&2
            exit 1
          fi
          printf '%s\n' "${TK104_DEPLOY_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Sync repository to tk104
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'data' --exclude 'dist' --exclude '.env' --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=${RUNNER_TEMP}/tk104_known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            ./ seregatipich@tk104.duckdns.org:~/apps/squad-admin-panel/

      - name: Rebuild and restart only web on tk104
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o UserKnownHostsFile="${RUNNER_TEMP}/tk104_known_hosts" \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            seregatipich@tk104.duckdns.org \
            'cd ~/apps/squad-admin-panel && bash scripts/deploy-tk104-web.sh'

      - name: External health check
        run: |
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://tk104.duckdns.org/health --max-time 10 || echo 000)
            echo "https://tk104.duckdns.org/health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "external health check did not reach 200" >&2
          exit 1

      - name: Remove SSH deploy key
        if: always()
        run: rm -f ~/.ssh/id_deploy "${RUNNER_TEMP}/tk104_known_hosts"
