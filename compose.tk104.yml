      WORKER: media-publisher
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      MEDIA_STORAGE_DIR: /var/lib/squad-panel/media
      MEDIA_PUBLISHER_INTERVAL_MS: ${MEDIA_PUBLISHER_INTERVAL_MS:-60000}
      MEDIA_PUBLISHER_BATCH_SIZE: ${MEDIA_PUBLISHER_BATCH_SIZE:-3}
      # YouTube Data API v3 OAuth (all three required, or YouTube stays off).
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # Telegram bot (both required, or Telegram stays off).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
