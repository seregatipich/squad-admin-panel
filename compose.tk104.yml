x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: admin
    # worker-rcon runs with network_mode: host and reaches postgres/redis via
    # 127.0.0.1 from the host namespace, not the compose network — must be
    # published to the host loopback for that worker to connect.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d admin']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  migrator:
    image: squad-panel/api:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG_is_required}
    # Release images are loaded onto the host, never pulled: a registry
    # lookup of this name could fetch somebody else's image.
    pull_policy: never
    restart: 'no'
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
    working_dir: /app/packages/db
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    image: squad-panel/api:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG_is_required}
    # Release images are loaded onto the host, never pulled: a registry
    # lookup of this name could fetch somebody else's image.
    pull_policy: never
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      # Redis the per-server sidecar container reaches. It runs with
      # --network host, so the compose service name does not resolve there.
      SIDECAR_REDIS_URL: ${SIDECAR_REDIS_URL:-redis://127.0.0.1:6379}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_DOMAIN: tk104.duckdns.org
      PANEL_PUBLIC_URL: https://tk104.duckdns.org
      COOKIE_SECURE: 'true'
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-21600}
      SESSION_TOUCH_THROTTLE_SECONDS: ${SESSION_TOUCH_THROTTLE_SECONDS:-60}
      # Shared secret for the inbound team-balancer proposal webhook (GAME-2,
      # #81). Unset leaves POST /api/v1/integrations/balancer/proposals
      # disabled (503).
      BALANCER_WEBHOOK_SECRET: ${BALANCER_WEBHOOK_SECRET:-}
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      # Must match the bind-mount source used by install-host-bridge.sh AND the
      # Environment= line in /etc/systemd/system/panel-host-bridge.service.d/install.conf.
      PANEL_DEPOT_HOST_PATH: ${DATA_DIR}/depot
      # Squad servers run with --network host on 127.0.0.1:{rcon_port} of the
      # host; from inside this container 127.0.0.1 is the api container itself.
      RCON_HOST_DEFAULT: host.docker.internal
      # VIDEO-1/VIDEO-4: uploaded media lives here, on a persistent volume shared
      # with worker-media-publisher. Both containers have different WORKDIRs, so
      # the relative default (./media) would resolve to two different, ephemeral
      # directories and the publisher would find nothing to upload.
      MEDIA_STORAGE_DIR: /var/lib/squad-panel/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "0:<panel-gid>"`, never `group_add: [<panel-gid>]`.
    # See docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
      - /run/squad-panel/rnsquadjs:/run/squad-panel/rnsquadjs:rw
      - media_data:/var/lib/squad-panel/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging

  worker-log-ingest:
    image: squad-panel/workers:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG_is_required}
    # Release images are loaded onto the host, never pulled: a registry
    # lookup of this name could fetch somebody else's image.
    pull_policy: never
    restart: unless-stopped
    environment:
      WORKER: log-ingest
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      # Decrypts the SSH private key of external servers' log sources
      # (server_log_sources); without it only panel-hosted containers are tailed.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-config-sync:
    image: squad-panel/workers:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG_is_required}
