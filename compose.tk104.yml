    logging: *default-logging

  # VIDEO-4 (#160): fans published media out to YouTube/Telegram. Both
  # destinations are optional — with no credentials the worker simply defers
  # every publication instead of failing it, so it is safe to run unconfigured.
  worker-media-publisher:
    image: squad-panel/workers:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG_is_required}
    # Release images are loaded onto the host, never pulled: a registry
    # lookup of this name could fetch somebody else's image.
