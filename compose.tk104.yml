      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-rcon:
    image: squad-panel/workers:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG_is_required}
    # Release images are loaded onto the host, never pulled: a registry
    # lookup of this name could fetch somebody else's image.
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    environment:
      WORKER: rcon
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@127.0.0.1:5432/admin
      REDIS_URL: redis://127.0.0.1:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      RCON_HOST_DEFAULT: 127.0.0.1
      RCON_ROSTER_INTERVAL_MS: ${RCON_ROSTER_INTERVAL_MS:-2000}
      RCON_INFO_INTERVAL_MS: ${RCON_INFO_INTERVAL_MS:-5000}
    depends_on:
