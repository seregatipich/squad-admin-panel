# Host build override for compose.tk104.yml.
#
# A push to dev never builds on tk104: the deploy workflow builds the api, web,
# workers and caddy images, pushes them to ghcr.io, and the host pulls them by
# digest (see docs/operations/deployment.md). This override restores the builds
# for the cases that still need them — scripts/dev-deploy-tk104.sh previews an
# unpushed working tree, and DEPLOY_BUILD=1 scripts/deploy-tk104.sh builds a
# whole release — tagging each image with the reference its *_IMAGE variable
# names, for example:
#
#   API_IMAGE=ghcr.io/seregatipich/squad-panel-api:dev-abc1234 \
#     docker compose --env-file .env.tk104 --env-file .release.env \
#     -f compose.tk104.yml -f compose.tk104.build.yml build api
#
# Every worker service builds the same all-workers image; the build cache makes
# every build after the first one a no-op.
x-workers-build: &workers-build
  context: .
  dockerfile: docker/worker.Dockerfile

services:
  migrator:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
  caddy:
    build:
      context: .
      dockerfile: docker/caddy-duckdns.Dockerfile
  worker-log-ingest:
    build: *workers-build
  worker-config-sync:
    build: *workers-build
  worker-rcon:
    build: *workers-build
  worker-audit-archiver:
    build: *workers-build
  worker-event-partition:
    build: *workers-build
  worker-presence-daily:
    build: *workers-build
  worker-role-expirer:
    build: *workers-build
  worker-seed-reward:
    build: *workers-build
  worker-steam-refresh:
    build: *workers-build
  worker-media-publisher:
    build: *workers-build
  worker-clan-guard:
    build: *workers-build
  worker-automation:
    build: *workers-build
  worker-scheduler:
    build: *workers-build
  worker-ban-sync:
    build: *workers-build
  worker-clan-priority-expirer:
    build: *workers-build
  worker-leaderboard-aggregator:
    build: *workers-build
  worker-diag-flush:
    build: *workers-build
  worker-metrics-sampler:
    build: *workers-build
  worker-discord:
    build: *workers-build
