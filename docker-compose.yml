x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      APP_IP: ${APP_IP:-127.0.0.1}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- -S --spider http://localhost/health 2>&1 | grep -qE "301 |308 " || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy

  migrator:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: 'no'
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
    working_dir: /app/packages/db
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      # Host-side path of the squad-depot volume. Must match the bind-mount
      # source used by install-host-bridge.sh AND the Environment= line in
      # /etc/systemd/system/panel-host-bridge.service. Without this override
      # server-install.ts reads from /var/lib/docker/volumes/squad-depot/_data
      # which does not exist for bind-mounted volumes.
      PANEL_DEPOT_HOST_PATH: ${DATA_DIR}/depot
      # Squad servers run with --network host and listen on 127.0.0.1:{rcon_port}
      # of the host. From inside this bridge-network container, 127.0.0.1 is the
      # api container itself — use the host-gateway alias instead so one-shot
      # RCON calls (graceful stop broadcast, PUT /configs reload) can reach the
      # Squad listener. See apps/api/src/routes/servers.ts and server-configs.ts.
      RCON_HOST_DEFAULT: host.docker.internal
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-https://squad-panel.lan}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-21600}
      SESSION_TOUCH_THROTTLE_SECONDS: ${SESSION_TOUCH_THROTTLE_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "0:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. See
    # docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
      - /run/squad-panel/rnsquadjs:/run/squad-panel/rnsquadjs:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  worker-log-ingest:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: log-ingest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "0:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. See
    # docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-config-sync:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: config-sync
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      PANEL_BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "0:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. See
    # docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-rcon:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: rcon
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@127.0.0.1:5432/admin
      REDIS_URL: redis://127.0.0.1:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # On --network host, Squad's RCON listener is on the local loopback.
      # Credentials with rcon_host=NULL fall back to this value.
      RCON_HOST_DEFAULT: 127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-audit-archiver:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: audit-archiver } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-event-partition:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: event-partition } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-presence-daily:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: presence-daily } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-role-expirer:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: role-expirer } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      ROLE_EXPIRER_INTERVAL_MS: ${ROLE_EXPIRER_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-seed-reward:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: seed-reward } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      SEED_REWARD_INTERVAL_MS: ${SEED_REWARD_INTERVAL_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-leaderboard-aggregator:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: leaderboard-aggregator } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-diag-flush:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: diag-flush } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      DIAG_FLUSH_BATCH_SIZE: ${DIAG_FLUSH_BATCH_SIZE:-100}
      DIAG_JOURNALD_FORWARD: ${DIAG_JOURNALD_FORWARD:-true}
      DIAG_JOURNALD_UNIT: ${DIAG_JOURNALD_UNIT:-panel-host-bridge}
      DIAG_JOURNALD_SINCE: ${DIAG_JOURNALD_SINCE:-30s ago}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-metrics-sampler:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: metrics-sampler
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "0:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. See
    # docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-clan-guard:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: clan-guard } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      CLAN_GUARD_INTERVAL_MS: ${CLAN_GUARD_INTERVAL_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-scheduler:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: scheduler } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      PANEL_BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      ROTATION_PROFILE_APPLY_HOUR: ${ROTATION_PROFILE_APPLY_HOUR:-4}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-https://squad-panel.lan}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-30000}
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-ban-sync:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: ban-sync } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      BAN_SYNC_INTERVAL_MS: ${BAN_SYNC_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-clan-priority-expirer:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: clan-priority-expirer } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      CLAN_PRIORITY_EXPIRER_INTERVAL_MS: ${CLAN_PRIORITY_EXPIRER_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-discord:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: discord } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d admin']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  # The bridge launches one squad-server container per panel server (named
  # `squad-{uuid}`), and a transient depot-init container for steamcmd
  # `app_update 403240`. Neither runs as a long-lived compose service, but
  # both images MUST exist locally with these exact tags. We declare them
  # under the `images` profile so `docker compose build` builds and tags
  # them in one shot, while `docker compose up` skips them.
  squad-server-image:
    build:
      context: ./docker
      dockerfile: squad-server.Dockerfile
    image: squad-server:latest
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  depot-init-image:
    build:
      context: ./docker
      dockerfile: depot-init.Dockerfile
    image: squad-panel/depot-init:latest
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  # The bridge launches one rnsquadjs sidecar per cutover server with
  # `--pull never`, so the tag MUST already exist locally. Context is the repo
  # root (not ./docker) because the Dockerfile COPYs `docker/rnsquadjs/...`.
  rnsquadjs-image:
    build:
      context: .
      dockerfile: docker/rnsquadjs.Dockerfile
    image: squad-panel/rnsquadjs:latest
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  # Restic backup of LOGICAL dumps, not the raw data dirs. PRE_COMMANDS run
  # (via the base image, which evals them in bash) before each snapshot:
  # pg_dump writes a custom-format Postgres dump and redis-cli fetches the
  # Redis RDB into the backup_dump volume, then restic backs up /data. Logical
  # dumps restore cleanly into a fresh stack (see scripts/restore.sh), which a
  # snapshot of live WAL/AOF files cannot guarantee — that is the point of #14.
  backup:
    build:
      context: .
      dockerfile: docker/restic.Dockerfile
    image: squad-panel/restic:latest
    restart: unless-stopped
    profiles: ['backup']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup/repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-changeme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_CRON: '0 3 * * *'
      RESTIC_FORGET_ARGS: '--keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune'
      RESTIC_BACKUP_SOURCES: /data
      PRE_COMMANDS: |
        mkdir -p /data/postgres /data/redis
        PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U admin -d admin -Fc -f /data/postgres/admin.dump
        redis-cli -h redis --rdb /data/redis/dump.rdb
    volumes:
      - backup_repo:/backup
      - backup_dump:/data
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/caddy-data
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/caddy-config
  backup_repo:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/backup-repo
  # Staging area the backup service writes its logical dumps into before restic
  # snapshots them (RESTIC_BACKUP_SOURCES=/data).
  backup_dump:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/backup-dump
