x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      BRIDGE_SOCKET: /run/panel-host-bridge.sock
      APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
    volumes:
      - /run/panel-host-bridge.sock:/run/panel-host-bridge.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  worker-log-ingest:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: log-ingest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge.sock
    volumes:
      - /run/panel-host-bridge.sock:/run/panel-host-bridge.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-rcon:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: rcon
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-audit-archiver:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: audit-archiver } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://redis:6379
    logging: *default-logging

  worker-event-partition:
    build: { context: ., dockerfile: docker/worker.Dockerfile, args: { WORKER: event-partition } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d admin']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  backup:
    image: mazzolino/restic:latest
    restart: unless-stopped
    profiles: ['backup']
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup/repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-changeme}
      BACKUP_CRON: '0 3 * * *'
      RESTIC_FORGET_ARGS: '--keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune'
    volumes:
      - backup_repo:/backup
      - postgres_data:/srv/postgres:ro
      - redis_data:/srv/redis:ro
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_repo:
