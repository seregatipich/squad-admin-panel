# Run from the repository root: .env there sets COMPOSE_FILE to this file, so a
# plain `docker compose ...` finds it and reads that .env. Paths below resolve
# from this directory, and the project name stays the one installs have run
# under (their containers, network and volumes).
name: squad-admin-panel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Container hardening (#47): no Linux capabilities and no privilege gain
# through setuid binaries. A service that needs a capability adds it back with
# cap_add and says why. postgres, redis and backup only get no-new-privileges:
# their entrypoints start as root and drop to their own user.
x-hardening: &hardening
  cap_drop: ['ALL']
  security_opt: ['no-new-privileges:true']
  # Bound fork bombs and reap zombies in every hardened service.
  pids_limit: 256
  init: true

services:
  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    init: true
    restart: unless-stopped
    # Binds :80/:443 as root inside the container.
    cap_add: ['NET_BIND_SERVICE']
    <<: *hardening
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      APP_IP: ${APP_IP:-127.0.0.1}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- -S --spider http://localhost/health 2>&1 | grep -qE "301 |308 " || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy

  migrator:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: 'no'
    <<: *hardening
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      # When both are set, the migrator provisions this least-privilege login
      # (packages/db/src/app-role.ts) and the api and workers connect as it.
      PANEL_DB_USER: ${PANEL_DB_USER:-}
      PANEL_DB_PASSWORD: ${PANEL_DB_PASSWORD:-}
    working_dir: /app/packages/db
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    # chown of the rnsquadjs sidecar config to the sidecar uid (lib/rnsquadjs.ts).
    cap_add: ['CHOWN']
    <<: *hardening
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Redis the per-server sidecar container reaches. It runs with
      # --network host, so the compose service name does not resolve there,
      # and it authenticates as the restricted `rnsquadjs` ACL user (see redis).
      SIDECAR_REDIS_URL: redis://rnsquadjs:${REDIS_SIDECAR_PASSWORD}@127.0.0.1:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY_is_required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET_is_required}
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      # Host-side path of the squad-depot volume. Must match the bind-mount
      # source used by install-host-bridge.sh AND the Environment= line in
      # /etc/systemd/system/panel-host-bridge.service. Without this override
      # server-install.ts reads from /var/lib/docker/volumes/squad-depot/_data
      # which does not exist for bind-mounted volumes.
      PANEL_DEPOT_HOST_PATH: ${DATA_DIR}/depot
      # Squad servers run with --network host and listen on 127.0.0.1:{rcon_port}
      # of the host. From inside this bridge-network container, 127.0.0.1 is the
      # api container itself — use the host-gateway alias instead so one-shot
      # RCON calls (graceful stop broadcast, PUT /configs reload) can reach the
      # Squad listener. See apps/api/src/routes/servers.ts and server-configs.ts.
      RCON_HOST_DEFAULT: host.docker.internal
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-https://squad-panel.lan}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Discord OAuth login and signed interactions (DISCORD-4). Unset leaves
      # /api/v1/auth/discord/login and /integrations/discord/interactions
      # answering 503.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-21600}
      SESSION_TOUCH_THROTTLE_SECONDS: ${SESSION_TOUCH_THROTTLE_SECONDS:-60}
      # Sentry-compatible error reporting. Blank disables it.
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      # Shared secret for the inbound team-balancer proposal webhook (GAME-2,
      # #81). Unset leaves POST /api/v1/integrations/balancer/proposals
      # disabled (503), which is the safe default for a deployment with no
      # SquadJS exporter wired up.
      BALANCER_WEBHOOK_SECRET: ${BALANCER_WEBHOOK_SECRET:-}
      # VIDEO-1/VIDEO-4: uploaded media lives here, on a persistent volume shared
      # with worker-media-publisher. Both containers have different WORKDIRs, so
      # the relative default (./media) would resolve to two different, ephemeral
      # directories and the publisher would find nothing to upload.
      MEDIA_STORAGE_DIR: /var/lib/squad-panel/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "<uid>:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. The api stays
    # uid 0 (with only CAP_CHOWN): it writes the root-owned rnsquadjs tree and
    # the media volume. See docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
      - /run/squad-panel/rnsquadjs:/run/squad-panel/rnsquadjs:rw
      - media_data:/var/lib/squad-panel/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    <<: *hardening
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-admin.localhost}
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

  worker-log-ingest:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: log-ingest
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      # Decrypts the SSH private key of external servers' log sources
      # (server_log_sources); without it only panel-hosted containers are tailed.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "<uid>:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. The uid is the
    # image's unprivileged `node` user (1000). See
    # docs/components/bridge/troubleshooting.md.
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-config-sync:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: config-sync
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PANEL_BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      CONFIG_DRIFT_INTERVAL_MS: ${CONFIG_DRIFT_INTERVAL_MS:-300000}
      ADMINS_CFG_RELAY_INTERVAL_MS: ${ADMINS_CFG_RELAY_INTERVAL_MS:-1000}
      ADMINS_CFG_RELAY_XADD_TIMEOUT_MS: ${ADMINS_CFG_RELAY_XADD_TIMEOUT_MS:-5000}
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "<uid>:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. The uid is the
    # image's unprivileged `node` user (1000). See
    # docs/components/bridge/troubleshooting.md.
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-rcon:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: rcon
    restart: unless-stopped
    <<: *hardening
    network_mode: host
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@127.0.0.1:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # On --network host, Squad's RCON listener is on the local loopback.
      # Credentials with rcon_host=NULL fall back to this value.
      RCON_HOST_DEFAULT: 127.0.0.1
      # Host of the seeding notification's steam://connect join link.
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-https://squad-panel.lan}
      RCON_ROSTER_INTERVAL_MS: ${RCON_ROSTER_INTERVAL_MS:-2000}
      RCON_INFO_INTERVAL_MS: ${RCON_INFO_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-audit-archiver:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: audit-archiver } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-event-partition:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: event-partition } }
    restart: unless-stopped
    <<: *hardening
    environment:
      # Always the schema owner: it creates and drops partitions (DDL).
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-presence-daily:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: presence-daily } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-role-expirer:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: role-expirer } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ROLE_EXPIRER_INTERVAL_MS: ${ROLE_EXPIRER_INTERVAL_MS:-60000}
      ROLE_EXPIRY_REMINDER_INTERVAL_MS: ${ROLE_EXPIRY_REMINDER_INTERVAL_MS:-86400000}
      VIP_RENEWAL_INTERVAL_MS: ${VIP_RENEWAL_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-seed-reward:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: seed-reward } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SEED_REWARD_INTERVAL_MS: ${SEED_REWARD_INTERVAL_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  # INT-1 (#76): gradually enriches stale player records from Steam without
  # coupling the sweep to API requests or user logins. No key means a safe
  # no-op while heartbeat stays visible.
  worker-steam-refresh:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: steam-refresh } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_REFRESH_INTERVAL_MS: ${STEAM_REFRESH_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  # VIDEO-4 (#160): fans published media out to YouTube/Telegram. Both
  # destinations are optional — with no credentials the worker simply defers
  # every publication instead of failing it, so it is safe to run unconfigured.
  worker-media-publisher:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: media-publisher } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEDIA_STORAGE_DIR: /var/lib/squad-panel/media
      MEDIA_PUBLISHER_INTERVAL_MS: ${MEDIA_PUBLISHER_INTERVAL_MS:-60000}
      MEDIA_PUBLISHER_BATCH_SIZE: ${MEDIA_PUBLISHER_BATCH_SIZE:-3}
      # YouTube Data API v3 OAuth (all three required, or YouTube stays off).
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # Telegram bot (both required, or Telegram stays off).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # Root without capabilities: it deletes media files the api (root) wrote.
    user: '0:0'
    volumes:
      - media_data:/var/lib/squad-panel/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-leaderboard-aggregator:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: leaderboard-aggregator } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LEADERBOARD_AGGREGATOR_INTERVAL_MS: ${LEADERBOARD_AGGREGATOR_INTERVAL_MS:-900000}
      LEADERBOARD_BACKFILL_MONTHS: ${LEADERBOARD_BACKFILL_MONTHS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-diag-flush:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: diag-flush } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DIAG_FLUSH_BATCH_SIZE: ${DIAG_FLUSH_BATCH_SIZE:-100}
      DIAG_JOURNALD_FORWARD: ${DIAG_JOURNALD_FORWARD:-true}
      DIAG_JOURNALD_UNIT: ${DIAG_JOURNALD_UNIT:-panel-host-bridge}
      DIAG_JOURNALD_SINCE: ${DIAG_JOURNALD_SINCE:-30s ago}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Root without capabilities: it reads the host journal (root:systemd-journal 0640).
    user: '0:0'
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-metrics-sampler:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER: metrics-sampler
    restart: unless-stopped
    <<: *hardening
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "<uid>:<panel-gid>"`, never `group_add: [<panel-gid>]`,
    # otherwise every RPC fails with `rejected untrusted peer`. The uid is the
    # image's unprivileged `node` user (1000). See
    # docs/components/bridge/troubleshooting.md.
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-clan-guard:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: clan-guard } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLAN_GUARD_INTERVAL_MS: ${CLAN_GUARD_INTERVAL_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  # AUTO-1 (#72): evaluates user-defined trigger rules over the event streams
  # and enqueues RCON actions / records firings. DB + Redis only, no bridge.
  worker-automation:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: automation } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-scheduler:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: scheduler } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PANEL_BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      ROTATION_PROFILE_APPLY_HOUR: ${ROTATION_PROFILE_APPLY_HOUR:-4}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-https://squad-panel.lan}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-30000}
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-ban-sync:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: ban-sync } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      BAN_SYNC_INTERVAL_MS: ${BAN_SYNC_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-clan-priority-expirer:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: clan-priority-expirer } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLAN_PRIORITY_EXPIRER_INTERVAL_MS: ${CLAN_PRIORITY_EXPIRER_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  worker-discord:
    build: { context: .., dockerfile: docker/worker.Dockerfile, args: { WORKER: discord } }
    restart: unless-stopped
    <<: *hardening
    environment:
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    logging: *default-logging

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    environment:
      POSTGRES_DB: admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d admin']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    # Redis is published on the host loopback, and the bridge starts the game
    # servers and the rnsquadjs sidecars with --network host, so any process
    # there can connect: every client must authenticate (#32). The default
    # user (REDIS_PASSWORD) is the panel's; `rnsquadjs` (REDIS_SIDECAR_PASSWORD)
    # is the third-party sidecar's and may only write its own event stream,
    # status and heartbeat keys, never session:* or command queues. Both are
    # embedded in redis:// URLs below, so keep them URL-safe (hex).
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --save
      - '60'
      - '1000'
      - --requirepass
      - '${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}'
      - --user
      - rnsquadjs
      - 'on'
      - '>${REDIS_SIDECAR_PASSWORD:?REDIS_SIDECAR_PASSWORD must be set (see .env.example)}'
      - resetchannels
      - '~events:server:*'
      - '~rnsquadjs:status:*'
      - '~worker:heartbeat:rnsquadjs:*'
      - '+ping'
      - '+info'
      - '+xadd'
      - '+set'
      - '+quit'
    environment:
      # redis-cli (healthcheck, `compose exec redis redis-cli`) authenticates with it.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  # The bridge launches one squad-server container per panel server (named
  # `squad-{uuid}`), and a transient depot-init container for steamcmd
  # `app_update 403240`. Neither runs as a long-lived compose service, but
  # both images MUST exist locally with these exact tags. We declare them
  # under the `images` profile so `docker compose build` builds and tags
  # them in one shot, while `docker compose up` skips them.
  squad-server-image:
    build:
      context: .
      dockerfile: squad-server.Dockerfile
    image: squad-server:latest
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  depot-init-image:
    build:
      context: .
      dockerfile: depot-init.Dockerfile
    image: squad-panel/depot-init:latest
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  # The bridge launches one rnsquadjs sidecar per cutover server with
  # `--pull never`, so the tag MUST already exist locally. Context is the repo
  # root (not ./docker) because the Dockerfile COPYs `docker/rnsquadjs/...`.
  rnsquadjs-image:
    build:
      context: ..
      dockerfile: docker/rnsquadjs.Dockerfile
    image: squad-panel/rnsquadjs:latest
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  # Restic backup of LOGICAL dumps, not the raw data dirs. PRE_COMMANDS run
  # (via the base image, which evals them in bash) before each snapshot:
  # pg_dump writes a custom-format Postgres dump and redis-cli fetches the
  # Redis RDB into the backup_dump volume, then restic backs up /data. Logical
  # dumps restore cleanly into a fresh stack (see scripts/restore.sh), which a
  # snapshot of live WAL/AOF files cannot guarantee — that is the point of #14.
  backup:
    build:
      context: ..
      dockerfile: docker/restic.Dockerfile
    image: squad-panel/restic:latest
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    profiles: ['backup']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup/repo}
      # No default: the repository holds full database and Redis dumps, so an
      # empty or well-known password must stop compose rather than encrypt it.
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD_is_required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # redis-cli --rdb below authenticates with it.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      BACKUP_CRON: '0 3 * * *'
      RESTIC_FORGET_ARGS: '--keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune'
      RESTIC_BACKUP_SOURCES: /data
      PRE_COMMANDS: |
        mkdir -p /data/postgres /data/redis
        PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U admin -d admin -Fc -f /data/postgres/admin.dump
        redis-cli -h redis --rdb /data/redis/dump.rdb
    volumes:
      - backup_repo:/backup
      - backup_dump:/data
    logging: *default-logging

volumes:
  media_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/media
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/redis
  caddy_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/caddy-data
  caddy_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/caddy-config
  backup_repo:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/backup-repo
  # Staging area the backup service writes its logical dumps into before restic
  # snapshots them (RESTIC_BACKUP_SOURCES=/data).
  backup_dump:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/backup-dump
