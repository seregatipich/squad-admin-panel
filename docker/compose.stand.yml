# The dev stand. Nothing is built here: the panel services run the images
# the deploy workflow pushed to ghcr.io, pinned by digest (API_IMAGE, WEB_IMAGE,
# WORKERS_IMAGE, CADDY_IMAGE). scripts/deploy-stand.sh records the running
# release in .release.env, so every compose command on the host reads both env
# files (Compose 2.17+ merges them; .release.env wins):
#
#   docker compose --env-file .env.stand --env-file .release.env -f docker/compose.stand.yml ps
#
# A fully qualified ghcr.io name pinned by digest can only ever resolve to that
# one image, so these services may pull (the deploy pulls just the changed
# ones). The host-built images at the bottom are different: their short names
# would resolve to somebody else's Docker Hub image, so they are never pulled —
# the bridge starts them with `--pull never`, and compose has `pull_policy: never`.
# Paths below resolve from this directory, so the project name is pinned to
# the one the stand has always run under (its volumes and containers).
name: squad-admin-panel

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Container hardening (#47): no Linux capabilities and no privilege gain
# through setuid binaries. A service that needs a capability adds it back with
# cap_add and says why. postgres, redis and backup only get no-new-privileges:
# their entrypoints start as root and drop to their own user.
x-hardening: &hardening
  cap_drop: ['ALL']
  security_opt: ['no-new-privileges:true']
  # Bound fork bombs and reap zombies in every hardened service.
  pids_limit: 256
  init: true
  # Read-only root filesystem: the services write only to their volumes and
  # bind mounts (checked with `docker diff` on the stand). /tmp is an
  # in-memory scratch directory; web adds its Next.js cache next to it.
  read_only: true
  tmpfs: ['/tmp']

# Resource limits sized from the usage measured on the stand after two days of
# uptime (workers 20-50 MiB, worker-diag-flush 116 MiB), with generous headroom.
# See docs/operations/deployment.md for how to change them.
x-worker-limits: &worker-limits
  mem_limit: 512m
  cpus: 1.0

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 4g
    # The per-process pools (DATABASE_POOL_MAX) sum to ~134 connections, more
    # than the stock limit of 100 connections (#1097).
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      POSTGRES_DB: admin
    # worker-rcon runs with network_mode: host and reaches postgres/redis via
    # 127.0.0.1 from the host namespace, not the compose network — must be
    # published to the host loopback for that worker to connect.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d admin']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    # Redis is published on the host loopback, and the bridge starts the game
    # servers and the rnsquadjs sidecars with --network host, so any process
    # there can connect: every client must authenticate (#32). The default
    # user (REDIS_PASSWORD) is the panel's; `rnsquadjs` (REDIS_SIDECAR_PASSWORD)
    # is the third-party sidecar's and may only write its own event stream,
    # status and heartbeat keys, never session:* or command queues. Both are
    # embedded in redis:// URLs below, so keep them URL-safe (hex).
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 1g
    # Redis Streams carry the domain events and consumer-group offsets, so the
    # stand persists every write to the AOF like docker/compose.yml (#47).
    # Redis started with --appendonly yes ignores an existing dump.rdb and
    # comes up empty, so the first start after the switch loads the RDB with
    # AOF off and has Redis rewrite it into the AOF before the real server
    # starts; later starts find appendonlydir and skip straight to it. The
    # temporary server takes the same password, which redis-cli sends from
    # REDISCLI_AUTH.
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -d /data/appendonlydir ] && [ -f /data/dump.rdb ]; then
          redis-server --dir /data --dbfilename dump.rdb --appendonly no --save '' --requirepass "$$REDISCLI_AUTH" &
          pid=$$!
          until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 0.3; done
          redis-cli config set appendonly yes >/dev/null
          sleep 1
          until [ "$$(redis-cli info persistence | tr -d '\r' | awk -F: '/^aof_rewrite_in_progress:/{print $$2}')" = 0 ]; do sleep 0.3; done
          status="$$(redis-cli info persistence | tr -d '\r' | awk -F: '/^aof_last_bgrewrite_status:/{print $$2}')"
          [ "$$status" = ok ] || { echo "AOF rewrite failed: $$status" >&2; exit 1; }
          redis-cli shutdown || true
          wait "$$pid" || true
        fi
        exec docker-entrypoint.sh redis-server --appendonly yes --save 60 1 \
          --maxmemory 768mb --maxmemory-policy noeviction \
          --requirepass '${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}' \
          --user rnsquadjs on '>${REDIS_SIDECAR_PASSWORD:?REDIS_SIDECAR_PASSWORD must be set (see .env.example)}' \
          resetchannels '~events:server:*' '~rnsquadjs:status:*' '~worker:heartbeat:rnsquadjs:*' \
          +ping +info +xadd +set +quit
    environment:
      # redis-cli (healthcheck, `compose exec redis redis-cli`) authenticates with it.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # Not part of `up`: deploy-stand.sh runs it explicitly (`run --rm migrator`)
  # after a database backup, and only when packages/db/drizzle changed, so a
  # failed migration stops the deploy before any app container is replaced.
  migrator:
    image: ${API_IMAGE:?API_IMAGE_is_required}
    profiles: ['migrate']
    restart: 'no'
    <<: *hardening
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      # When both are set, the migrator provisions this least-privilege login
      # (packages/db/src/app-role.ts) and the api and workers connect as it.
      PANEL_DB_USER: ${PANEL_DB_USER:-}
      PANEL_DB_PASSWORD: ${PANEL_DB_PASSWORD:-}
    working_dir: /app/packages/db
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  api:
    image: ${API_IMAGE:?API_IMAGE_is_required}
    restart: unless-stopped
    # chown of the rnsquadjs sidecar config to the sidecar uid (lib/rnsquadjs.ts).
    cap_add: ['CHOWN']
    <<: *hardening
    mem_limit: 1g
    cpus: 2.0
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # From .release.env: the commit that introduced the running api image.
      # It changes only with that image, so a release that leaves the api
      # alone does not recreate it just to report a new SHA.
      APP_VERSION: ${APP_VERSION:-dev}
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Redis the per-server sidecar container reaches. It runs with
      # --network host, so the compose service name does not resolve there,
      # and it authenticates as the restricted `rnsquadjs` ACL user (see redis).
      SIDECAR_REDIS_URL: redis://rnsquadjs:${REDIS_SIDECAR_PASSWORD}@127.0.0.1:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY_is_required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET_is_required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN_is_required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:?PANEL_PUBLIC_URL_is_required}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Discord OAuth login and signed interactions (DISCORD-4). Unset leaves
      # /api/v1/auth/discord/login and /integrations/discord/interactions
      # answering 503.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-21600}
      SESSION_TOUCH_THROTTLE_SECONDS: ${SESSION_TOUCH_THROTTLE_SECONDS:-60}
      # Sentry-compatible error reporting. Blank disables it.
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      # Shared secret for the inbound team-balancer proposal webhook (GAME-2,
      # #81). Unset leaves POST /api/v1/integrations/balancer/proposals
      # disabled (503).
      BALANCER_WEBHOOK_SECRET: ${BALANCER_WEBHOOK_SECRET:-}
      EXTERNAL_HOST_PRIVATE_ALLOWLIST: ${EXTERNAL_HOST_PRIVATE_ALLOWLIST:-}
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      # Must match the bind-mount source used by install-host-bridge.sh AND the
      # Environment= line in /etc/systemd/system/panel-host-bridge.service.d/install.conf.
      PANEL_DEPOT_HOST_PATH: ${DATA_DIR}/depot
      # Squad servers run with --network host on 127.0.0.1:{rcon_port} of the
      # host; from inside this container 127.0.0.1 is the api container itself.
      RCON_HOST_DEFAULT: host.docker.internal
      # VIDEO-1/VIDEO-4: uploaded media lives here, on a persistent volume shared
      # with worker-media-publisher. Both containers have different WORKDIRs, so
      # the relative default (./media) would resolve to two different, ephemeral
      # directories and the publisher would find nothing to upload.
      MEDIA_STORAGE_DIR: /var/lib/squad-panel/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bridge SO_PEERCRED checks the primary GID, not supplementary groups —
    # this MUST be `user: "<uid>:<panel-gid>"`, never `group_add: [<panel-gid>]`.
    # The api stays uid 0 (with only CAP_CHOWN): it writes the root-owned
    # rnsquadjs tree and the media volume. See docs/components/bridge/troubleshooting.md.
    user: "0:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
      - /run/squad-panel/rnsquadjs:/run/squad-panel/rnsquadjs:rw
      - media_data:/var/lib/squad-panel/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A 5 s interval lets the deploy see a recreated api healthy within
    # seconds of it listening. start_interval would allow a slower steady
    # state, but Compose refuses it on a Docker Engine older than 25, and
    # nothing checks the engine before a push reaches the stand.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging

  worker-log-ingest:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: log-ingest
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      # Decrypts the SSH private key of external servers' log sources
      # (server_log_sources); without it only panel-hosted containers are tailed.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # Optional GeoLite2 City database resolving player connect IPs to a
      # country/city; absent file = geo fields stay NULL.
      GEOIP_DB_PATH: /geoip/GeoLite2-City.mmdb
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
      - ${GEOIP_DB_DIR:-/var/lib/squad-panel/geoip}:/geoip:ro
      # GeoLite2 database downloaded once GeoIP is enabled in the panel.
      - geoip_data:/var/lib/panel-geoip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-config-sync:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: config-sync
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PANEL_BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      ADMINS_CFG_RELAY_INTERVAL_MS: ${ADMINS_CFG_RELAY_INTERVAL_MS:-1000}
      ADMINS_CFG_RELAY_XADD_TIMEOUT_MS: ${ADMINS_CFG_RELAY_XADD_TIMEOUT_MS:-5000}
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-rcon:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    network_mode: host
    environment:
      WORKER: rcon
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@127.0.0.1:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@127.0.0.1:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      RCON_HOST_DEFAULT: 127.0.0.1
      # Host of the seeding notification's steam://connect join link.
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:?PANEL_PUBLIC_URL_is_required}
      RCON_ROSTER_INTERVAL_MS: ${RCON_ROSTER_INTERVAL_MS:-2000}
      RCON_INFO_INTERVAL_MS: ${RCON_INFO_INTERVAL_MS:-5000}
      EXTERNAL_HOST_PRIVATE_ALLOWLIST: ${EXTERNAL_HOST_PRIVATE_ALLOWLIST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-audit-archiver:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: audit-archiver
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  worker-event-partition:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: event-partition
      # Always the schema owner: it creates and drops partitions (DDL).
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  worker-presence-daily:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: presence-daily
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  worker-role-expirer:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: role-expirer
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ROLE_EXPIRER_INTERVAL_MS: ${ROLE_EXPIRER_INTERVAL_MS:-60000}
      ROLE_EXPIRY_REMINDER_INTERVAL_MS: ${ROLE_EXPIRY_REMINDER_INTERVAL_MS:-86400000}
      VIP_RENEWAL_INTERVAL_MS: ${VIP_RENEWAL_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-seed-reward:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: seed-reward
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SEED_REWARD_INTERVAL_MS: ${SEED_REWARD_INTERVAL_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # INT-1 (#76): gradually enriches stale player records from Steam without
  # coupling the sweep to API requests or user logins. No key means a safe
  # no-op while heartbeat stays visible.
  worker-steam-refresh:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: steam-refresh
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_REFRESH_INTERVAL_MS: ${STEAM_REFRESH_INTERVAL_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # VIDEO-4 (#160): fans published media out to YouTube/Telegram. Both
  # destinations are optional — with no credentials the worker simply defers
  # every publication instead of failing it, so it is safe to run unconfigured.
  worker-media-publisher:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: media-publisher
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEDIA_STORAGE_DIR: /var/lib/squad-panel/media
      MEDIA_PUBLISHER_INTERVAL_MS: ${MEDIA_PUBLISHER_INTERVAL_MS:-60000}
      MEDIA_PUBLISHER_BATCH_SIZE: ${MEDIA_PUBLISHER_BATCH_SIZE:-3}
      # YouTube Data API v3 OAuth (all three required, or YouTube stays off).
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      # Telegram bot (both required, or Telegram stays off).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # Root without capabilities: it deletes media files the api (root) wrote.
    user: '0:0'
    volumes:
      - media_data:/var/lib/squad-panel/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-clan-guard:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: clan-guard
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLAN_GUARD_INTERVAL_MS: ${CLAN_GUARD_INTERVAL_MS:-120000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # AUTO-1 (#72): evaluates user-defined trigger rules over the event streams
  # and enqueues RCON actions / records firings. DB + Redis only, no bridge.
  worker-automation:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: automation
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-scheduler:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: scheduler
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PANEL_BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      ROTATION_PROFILE_APPLY_HOUR: ${ROTATION_PROFILE_APPLY_HOUR:-4}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:?PANEL_PUBLIC_URL_is_required}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-30000}
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-ban-sync:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: ban-sync
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      BAN_SYNC_INTERVAL_MS: ${BAN_SYNC_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-clan-priority-expirer:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: clan-priority-expirer
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CLAN_PRIORITY_EXPIRER_INTERVAL_MS: ${CLAN_PRIORITY_EXPIRER_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-leaderboard-aggregator:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: leaderboard-aggregator
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LEADERBOARD_AGGREGATOR_INTERVAL_MS: ${LEADERBOARD_AGGREGATOR_INTERVAL_MS:-900000}
      LEADERBOARD_BACKFILL_MONTHS: ${LEADERBOARD_BACKFILL_MONTHS:-0}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  worker-diag-flush:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: diag-flush
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DIAG_FLUSH_BATCH_SIZE: ${DIAG_FLUSH_BATCH_SIZE:-100}
      DIAG_JOURNALD_FORWARD: ${DIAG_JOURNALD_FORWARD:-true}
      DIAG_JOURNALD_UNIT: ${DIAG_JOURNALD_UNIT:-panel-host-bridge}
      DIAG_JOURNALD_SINCE: ${DIAG_JOURNALD_SINCE:-30s ago}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Root without capabilities: it reads the host journal (root:systemd-journal 0640).
    user: '0:0'
    volumes:
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-metrics-sampler:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: metrics-sampler
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BRIDGE_SOCKET: /run/panel-host-bridge/bridge.sock
      LOG_LEVEL: ${LOG_LEVEL:-info}
    user: "1000:${PANEL_GID:-987}"
    volumes:
      - /run/panel-host-bridge:/run/panel-host-bridge
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  worker-discord:
    image: ${WORKERS_IMAGE:?WORKERS_IMAGE_is_required}
    restart: unless-stopped
    <<: [*hardening, *worker-limits]
    environment:
      WORKER: discord
      DATABASE_URL: postgres://${PANEL_DB_USER:-admin}:${PANEL_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:?PANEL_PUBLIC_URL_is_required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE_is_required}
    restart: unless-stopped
    <<: *hardening
    mem_limit: 1g
    cpus: 2.0
    # next start writes its image-optimisation cache here; owned by the image's
    # unprivileged node user (uid 1000).
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN_is_required}
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    # The runtime image has node but neither wget nor curl. Without a session
    # the middleware answers /dashboard with a redirect, so the probe proves
    # Next.js is serving without rendering a page or calling the api.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/dashboard',{redirect:'manual'}).then((r)=>process.exit(r.status<500?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE_is_required}
    init: true
    restart: unless-stopped
    # Binds :80/:443 as root inside the container.
    cap_add: ['NET_BIND_SERVICE']
    <<: *hardening
    mem_limit: 256m
    ports:
      - '443:443'
    environment:
      # Let's Encrypt rejects contact addresses on the reserved example.com
      # domain, so a missing value must fail fast rather than silently break
      # certificate issuance/renewal.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL_is_required}
      # The site Caddyfile.stand serves; it lives in the host's .env.stand.
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN_is_required}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN_is_required}
      # Hash of docker/Caddyfile.stand, from .release.env. Compose cannot see
      # a bind-mounted file change, and a single-file mount keeps showing the
      # replaced inode after rsync, so a Caddyfile edit must recreate caddy.
      CADDYFILE_SHA: ${CADDYFILE_SHA:-}
    volumes:
      - ./Caddyfile.stand:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *default-logging

  # The bridge launches one squad-server container per panel server (named
  # `squad-{uuid}`), and a transient depot-init container for steamcmd
  # `app_update 403240`. Neither runs as a long-lived compose service, but
  # both images MUST exist locally with these exact tags. Declared under the
  # `images` profile so `docker compose --profile images build` builds and
  # tags them in one shot, while `docker compose up` skips them.
  squad-server-image:
    build:
      context: .
      dockerfile: squad-server.Dockerfile
    image: squad-server:latest
    pull_policy: never
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  depot-init-image:
    build:
      context: .
      dockerfile: depot-init.Dockerfile
    image: squad-panel/depot-init:latest
    pull_policy: never
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  # The bridge launches one rnsquadjs sidecar per cutover server with
  # `--pull never`, so the tag MUST already exist locally. Context is the repo
  # root (not this directory) because the Dockerfile COPYs `docker/rnsquadjs/...`.
  rnsquadjs-image:
    build:
      context: ..
      dockerfile: docker/rnsquadjs.Dockerfile
    image: squad-panel/rnsquadjs:latest
    pull_policy: never
    profiles: ['images']
    command: ['/bin/true']
    restart: 'no'

  # Restic backups (profile `backup`), the same service as in
  # docker/compose.yml: logical pg_dump + Redis RDB into backup_dump, then a
  # restic snapshot of it. The host bridge's backup RPCs run it through this
  # file (PANEL_COMPOSE_FILE=docker/compose.stand.yml, see
  # scripts/install-host-bridge.sh). The image is host-built like the ones
  # above, so it is never pulled.
  backup:
    build:
      context: ..
      dockerfile: docker/restic.Dockerfile
    image: squad-panel/restic:latest
    pull_policy: never
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    profiles: ['backup']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup/repo}
      # No well-known default. Unlike docker/compose.yml this is not `:?`:
      # every stand deploy interpolates this file, and a stand without backups
      # configured must still deploy. restic itself refuses an empty password,
      # so an unset one fails the backup, never encrypts with a public secret.
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # redis-cli --rdb below authenticates with it.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      BACKUP_CRON: '0 3 * * *'
      RESTIC_FORGET_ARGS: '--keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune'
      RESTIC_BACKUP_SOURCES: /data
      PRE_COMMANDS: |
        mkdir -p /data/postgres /data/redis
        PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U admin -d admin -Fc -f /data/postgres/admin.dump
        redis-cli -h redis --rdb /data/redis/dump.rdb
    volumes:
      - backup_repo:/backup
      - backup_dump:/data
    logging: *default-logging

volumes:
  geoip_data:
  media_data:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  # Bound under DATA_DIR like docker/compose.yml: the host bridge archives
  # expiring server logs into ${DATA_DIR}/backup-dump (PANEL_BACKUP_DUMP_ROOT)
  # and scripts/restore.sh reads the restored dump.rdb from there.
  backup_repo:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/backup-repo
  backup_dump:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/backup-dump
